[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surgical-coat-analyzer"
version = "0.1.0"
description = "Local image workflow for left/middle/right coat-colour analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
]

[project.scripts]
surgical-coat-analyzer = "coat_analyzer.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coat_analyzer = ["web/*.html", "web/*.css", "web/*.js"]
